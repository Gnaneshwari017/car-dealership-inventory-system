services:
  # Managed PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: apex_dealership_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dealership_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-SuperSecretPgPass2026!}
      POSTGRES_DB: ${POSTGRES_DB:-dealership_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dealership_admin -d dealership_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # FastAPI Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: apex_dealership_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-dealership_admin}:${POSTGRES_PASSWORD:-SuperSecretPgPass2026!}@db:5432/${POSTGRES_DB:-dealership_db}
      JWT_SECRET: ${JWT_SECRET:-super-secret-production-jwt-key-2026-apex-dealership}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      CORS_ORIGINS: "http://localhost,http://localhost:80,http://localhost:5173"
      ENVIRONMENT: production
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             python -m app.utils.seed &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  # React Frontend (Nginx SPA)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: apex_dealership_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
    driver: local
