<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 750" width="1000" height="750" fill="#020617" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <!-- Background with backdrop overlay -->
  <rect width="1000" height="750" fill="#000000" fill-opacity="0.8"/>
  
  <!-- Modal Dialog -->
  <g transform="translate(175, 45)">
    <rect width="650" height="660" rx="28" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    
    <!-- Header -->
    <rect x="30" y="30" width="48" height="48" rx="14" fill="#0369a1" fill-opacity="0.2"/>
    <text x="44" y="60" fill="#38bdf8" font-size="20">🏎️</text>
    <text x="90" y="50" fill="#ffffff" font-size="20" font-weight="800">Add New Vehicle to Inventory</text>
    <text x="90" y="68" fill="#94a3b8" font-size="12">Fill in the vehicle specifications for the catalog</text>

    <!-- Close button -->
    <circle cx="610" cy="50" r="16" fill="#1e293b"/>
    <text x="604" y="55" fill="#94a3b8" font-size="14">✕</text>

    <!-- Form Fields Grid -->
    <!-- Row 1: Make & Model -->
    <text x="30" y="115" fill="#cbd5e1" font-size="11" font-weight="700">MANUFACTURER / MAKE *</text>
    <rect x="30" y="125" width="280" height="42" rx="12" fill="#020617" stroke="#334155"/>
    <text x="45" y="151" fill="#ffffff" font-size="13">Rivian</text>

    <text x="340" y="115" fill="#cbd5e1" font-size="11" font-weight="700">MODEL *</text>
    <rect x="340" y="125" width="280" height="42" rx="12" fill="#020617" stroke="#334155"/>
    <text x="355" y="151" fill="#ffffff" font-size="13">R1T Adventure</text>

    <!-- Row 2: Year & Category -->
    <text x="30" y="195" fill="#cbd5e1" font-size="11" font-weight="700">MODEL YEAR *</text>
    <rect x="30" y="205" width="280" height="42" rx="12" fill="#020617" stroke="#334155"/>
    <text x="45" y="231" fill="#ffffff" font-size="13">2024</text>

    <text x="340" y="195" fill="#cbd5e1" font-size="11" font-weight="700">CATEGORY *</text>
    <rect x="340" y="205" width="280" height="42" rx="12" fill="#020617" stroke="#334155"/>
    <text x="355" y="231" fill="#ffffff" font-size="13">Truck</text>

    <!-- Row 3: Price & Quantity -->
    <text x="30" y="275" fill="#cbd5e1" font-size="11" font-weight="700">PRICE (USD) *</text>
    <rect x="30" y="285" width="280" height="42" rx="12" fill="#020617" stroke="#334155"/>
    <text x="45" y="311" fill="#ffffff" font-size="13">$ 74,800</text>

    <text x="340" y="275" fill="#cbd5e1" font-size="11" font-weight="700">QUANTITY IN STOCK *</text>
    <rect x="340" y="285" width="280" height="42" rx="12" fill="#020617" stroke="#334155"/>
    <text x="355" y="311" fill="#ffffff" font-size="13">3</text>

    <!-- Row 4: VIN & Image URL -->
    <text x="30" y="355" fill="#cbd5e1" font-size="11" font-weight="700">VIN (OPTIONAL)</text>
    <rect x="30" y="365" width="280" height="42" rx="12" fill="#020617" stroke="#334155"/>
    <text x="45" y="391" fill="#94a3b8" font-size="12" font-family="monospace">7FCTGAAA2NN018241</text>

    <text x="340" y="355" fill="#cbd5e1" font-size="11" font-weight="700">IMAGE URL (OPTIONAL)</text>
    <rect x="340" y="365" width="280" height="42" rx="12" fill="#020617" stroke="#334155"/>
    <text x="355" y="391" fill="#94a3b8" font-size="12">https://images.unsplash.com/...</text>

    <!-- Row 5: Description -->
    <text x="30" y="435" fill="#cbd5e1" font-size="11" font-weight="700">DESCRIPTION &amp; HIGHLIGHTS</text>
    <rect x="30" y="445" width="590" height="90" rx="12" fill="#020617" stroke="#334155"/>
    <text x="45" y="475" fill="#ffffff" font-size="12">Quad-Motor All-Wheel Drive electric pickup with gear tunnel, air suspension,</text>
    <text x="45" y="495" fill="#ffffff" font-size="12">and 835 horsepower delivering exceptional off-road performance.</text>

    <!-- Modal Actions -->
    <rect x="380" y="580" width="110" height="44" rx="12" fill="#1e293b"/>
    <text x="415" y="607" fill="#cbd5e1" font-size="13" font-weight="700">Cancel</text>

    <rect x="505" y="580" width="115" height="44" rx="12" fill="url(#saveGrad)"/>
    <text x="525" y="607" fill="#ffffff" font-size="13" font-weight="800">Save Vehicle</text>
  </g>

  <!-- Gradients -->
  <defs>
    <linearGradient id="saveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
  </defs>
</svg>
