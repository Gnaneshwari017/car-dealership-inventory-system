<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" fill="#020617" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <!-- Background -->
  <rect width="1200" height="800" fill="#020617"/>
  
  <!-- Navbar -->
  <rect x="0" y="0" width="1200" height="70" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <rect x="30" y="15" width="40" height="40" rx="10" fill="url(#brandGrad)"/>
  <text x="80" y="42" fill="#ffffff" font-size="20" font-weight="900" letter-spacing="1">APEX <tspan fill="#38bdf8">MOTORS</tspan></text>
  <text x="80" y="55" fill="#64748b" font-size="9" font-weight="700" letter-spacing="1">DEALERSHIP INVENTORY</text>
  
  <!-- Nav links -->
  <rect x="300" y="18" width="110" height="34" rx="8" fill="#1e293b"/>
  <text x="330" y="40" fill="#ffffff" font-size="13" font-weight="700">Dashboard</text>
  <text x="440" y="40" fill="#94a3b8" font-size="13" font-weight="500">Admin Portal</text>
  
  <!-- Nav right demo switcher -->
  <rect x="830" y="18" width="180" height="34" rx="17" fill="#090d16" stroke="#1e293b"/>
  <text x="845" y="39" fill="#94a3b8" font-size="11">Demo:</text>
  <text x="890" y="39" fill="#38bdf8" font-size="11" font-weight="700">Buyer</text>
  <text x="930" y="39" fill="#334155" font-size="11">|</text>
  <text x="945" y="39" fill="#34d399" font-size="11" font-weight="700">Admin</text>
  
  <rect x="1030" y="18" width="135" height="34" rx="8" fill="#0284c7"/>
  <text x="1065" y="40" fill="#ffffff" font-size="12" font-weight="700">Jane Doe (Buyer)</text>

  <!-- KPI Metrics Section -->
  <g transform="translate(30, 95)">
    <!-- KPI 1 -->
    <rect x="0" y="0" width="265" height="90" rx="16" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="20" y="30" fill="#94a3b8" font-size="11" font-weight="700" letter-spacing="1">TOTAL MODELS</text>
    <text x="20" y="65" fill="#ffffff" font-size="28" font-weight="900">9 Listings</text>
    <circle cx="230" cy="45" r="18" fill="#38bdf8" fill-opacity="0.1"/>
    
    <!-- KPI 2 -->
    <rect x="290" y="0" width="265" height="90" rx="16" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="310" y="30" fill="#94a3b8" font-size="11" font-weight="700" letter-spacing="1">AVAILABLE STOCK</text>
    <text x="310" y="65" fill="#34d399" font-size="28" font-weight="900">41 Units</text>
    <circle cx="520" cy="45" r="18" fill="#34d399" fill-opacity="0.1"/>

    <!-- KPI 3 -->
    <rect x="580" y="0" width="265" height="90" rx="16" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="600" y="30" fill="#94a3b8" font-size="11" font-weight="700" letter-spacing="1">LOW STOCK ALERTS</text>
    <text x="600" y="65" fill="#fbbf24" font-size="28" font-weight="900">1 Vehicle</text>
    <circle cx="810" cy="45" r="18" fill="#fbbf24" fill-opacity="0.1"/>

    <!-- KPI 4 -->
    <rect x="870" y="0" width="270" height="90" rx="16" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="890" y="30" fill="#94a3b8" font-size="11" font-weight="700" letter-spacing="1">SOLD OUT</text>
    <text x="890" y="65" fill="#f87171" font-size="28" font-weight="900">1 Vehicle</text>
    <circle cx="1100" cy="45" r="18" fill="#f87171" fill-opacity="0.1"/>
  </g>

  <!-- Filter & Search Bar -->
  <g transform="translate(30, 205)">
    <rect x="0" y="0" width="1140" height="100" rx="20" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    
    <!-- Search Input Box -->
    <rect x="20" y="18" width="460" height="42" rx="12" fill="#020617" stroke="#334155"/>
    <text x="45" y="44" fill="#64748b" font-size="13">Search by Make or Model (e.g. Tesla, Mustang, Porsche)...</text>
    
    <!-- Price Range -->
    <rect x="500" y="18" width="120" height="42" rx="12" fill="#020617" stroke="#334155"/>
    <text x="520" y="44" fill="#94a3b8" font-size="12">$ Min Price</text>
    <text x="630" y="44" fill="#475569" font-size="12">-</text>
    <rect x="645" y="18" width="120" height="42" rx="12" fill="#020617" stroke="#334155"/>
    <text x="665" y="44" fill="#94a3b8" font-size="12">$ Max Price</text>

    <!-- In Stock Filter -->
    <rect x="785" y="18" width="170" height="42" rx="12" fill="#020617" stroke="#334155"/>
    <rect x="800" y="30" width="16" height="16" rx="4" fill="#34d399"/>
    <text x="825" y="43" fill="#ffffff" font-size="12" font-weight="600">In Stock Only</text>

    <rect x="975" y="18" width="140" height="42" rx="12" fill="#0284c7"/>
    <text x="1015" y="44" fill="#ffffff" font-size="13" font-weight="700">Filter Search</text>

    <!-- Category Pills -->
    <text x="20" y="84" fill="#64748b" font-size="11" font-weight="700">CATEGORY:</text>
    <rect x="95" y="70" width="50" height="22" rx="6" fill="#0284c7"/>
    <text x="110" y="85" fill="#ffffff" font-size="11" font-weight="700">All</text>
    <rect x="155" y="70" width="65" height="22" rx="6" fill="#020617" stroke="#334155"/>
    <text x="170" y="85" fill="#94a3b8" font-size="11">Sedan</text>
    <rect x="230" y="70" width="55" height="22" rx="6" fill="#020617" stroke="#334155"/>
    <text x="245" y="85" fill="#94a3b8" font-size="11">SUV</text>
    <rect x="295" y="70" width="65" height="22" rx="6" fill="#020617" stroke="#334155"/>
    <text x="307" y="85" fill="#94a3b8" font-size="11">Electric</text>
    <rect x="370" y="70" width="65" height="22" rx="6" fill="#020617" stroke="#334155"/>
    <text x="383" y="85" fill="#94a3b8" font-size="11">Sports</text>
    <rect x="445" y="70" width="60" height="22" rx="6" fill="#020617" stroke="#334155"/>
    <text x="458" y="85" fill="#94a3b8" font-size="11">Truck</text>
  </g>

  <!-- Vehicle Cards Section -->
  <g transform="translate(30, 325)">
    <!-- Vehicle Card 1: Toyota Camry -->
    <g transform="translate(0, 0)">
      <rect width="360" height="440" rx="24" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <rect width="360" height="200" rx="24" fill="#1e293b"/>
      <rect x="15" y="15" width="70" height="24" rx="12" fill="#0f172a" fill-opacity="0.9"/>
      <text x="30" y="31" fill="#e2e8f0" font-size="11" font-weight="700">SEDAN</text>
      <rect x="240" y="15" width="105" height="24" rx="12" fill="#064e3b" fill-opacity="0.9"/>
      <text x="255" y="31" fill="#6ee7b7" font-size="11" font-weight="700">7 IN STOCK</text>
      <text x="20" y="180" fill="#ffffff" font-size="24" font-weight="900">$28,500</text>
      
      <text x="20" y="235" fill="#ffffff" font-size="18" font-weight="800">Toyota <tspan font-weight="400" fill="#cbd5e1">Camry XSE</tspan></text>
      <text x="20" y="255" fill="#64748b" font-size="11">VIN: 4T1B11HK5JU123456</text>
      <text x="20" y="285" fill="#94a3b8" font-size="12">Dynamic premium sport trim with leather upholstery and Toyota Safety Sense.</text>
      
      <rect x="20" y="370" width="320" height="46" rx="14" fill="url(#purchaseGrad)"/>
      <text x="125" y="398" fill="#ffffff" font-size="13" font-weight="700">Purchase Vehicle</text>
    </g>

    <!-- Vehicle Card 2: Tesla Model 3 -->
    <g transform="translate(390, 0)">
      <rect width="360" height="440" rx="24" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <rect width="360" height="200" rx="24" fill="#1e293b"/>
      <rect x="15" y="15" width="80" height="24" rx="12" fill="#0f172a" fill-opacity="0.9"/>
      <text x="28" y="31" fill="#e2e8f0" font-size="11" font-weight="700">ELECTRIC</text>
      <rect x="240" y="15" width="105" height="24" rx="12" fill="#064e3b" fill-opacity="0.9"/>
      <text x="255" y="31" fill="#6ee7b7" font-size="11" font-weight="700">6 IN STOCK</text>
      <text x="20" y="180" fill="#ffffff" font-size="24" font-weight="900">$47,990</text>
      
      <text x="20" y="235" fill="#ffffff" font-size="18" font-weight="800">Tesla <tspan font-weight="400" fill="#cbd5e1">Model 3 Long Range</tspan></text>
      <text x="20" y="255" fill="#64748b" font-size="11">VIN: 5YJ3E1EB8NF123456</text>
      <text x="20" y="285" fill="#94a3b8" font-size="12">Dual Motor AWD, 341 mi EPA range, rapid supercharging capability.</text>
      
      <rect x="20" y="370" width="320" height="46" rx="14" fill="url(#purchaseGrad)"/>
      <text x="125" y="398" fill="#ffffff" font-size="13" font-weight="700">Purchase Vehicle</text>
    </g>

    <!-- Vehicle Card 3: Mercedes EQS (SOLD OUT) -->
    <g transform="translate(780, 0)">
      <rect width="360" height="440" rx="24" fill="#090d16" stroke="#334155" stroke-width="1" fill-opacity="0.6"/>
      <rect width="360" height="200" rx="24" fill="#1e293b" fill-opacity="0.5"/>
      <rect x="15" y="15" width="80" height="24" rx="12" fill="#0f172a" fill-opacity="0.9"/>
      <text x="28" y="31" fill="#e2e8f0" font-size="11" font-weight="700">ELECTRIC</text>
      <rect x="235" y="15" width="110" height="24" rx="12" fill="#881337" fill-opacity="0.9"/>
      <text x="250" y="31" fill="#fca5a5" font-size="11" font-weight="700">OUT OF STOCK</text>
      <text x="20" y="180" fill="#cbd5e1" font-size="24" font-weight="900">$104,400</text>
      
      <text x="20" y="235" fill="#94a3b8" font-size="18" font-weight="800">Mercedes-Benz <tspan font-weight="400" fill="#64748b">EQS 450+</tspan></text>
      <text x="20" y="255" fill="#475569" font-size="11">VIN: W1KCG2DB4NA123456</text>
      <text x="20" y="285" fill="#64748b" font-size="12">Ultra-luxury electric sedan with MBUX Hyperscreen and air suspension.</text>
      
      <!-- Disabled Purchase Button -->
      <rect x="20" y="370" width="320" height="46" rx="14" fill="#1e293b" stroke="#334155"/>
      <text x="140" y="398" fill="#64748b" font-size="13" font-weight="700">Out of Stock</text>
    </g>
  </g>

  <!-- Definitions -->
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="purchaseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
  </defs>
</svg>
