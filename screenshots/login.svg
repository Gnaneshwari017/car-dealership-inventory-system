<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700" fill="#020617" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <!-- Background -->
  <rect width="1000" height="700" fill="#020617"/>
  
  <!-- Centered Login Card -->
  <g transform="translate(275, 80)">
    <rect width="450" height="540" rx="28" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    
    <!-- Icon Header -->
    <rect x="195" y="35" width="60" height="60" rx="18" fill="url(#loginGrad)"/>
    <text x="216" y="72" fill="#ffffff" font-size="24">🔒</text>

    <!-- Title -->
    <text x="225" y="130" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="900">Sign In to Apex Motors</text>
    <text x="225" y="152" text-anchor="middle" fill="#94a3b8" font-size="12">Access real-time vehicle inventory &amp; purchases</text>

    <!-- Demo Credentials Bar -->
    <rect x="30" y="175" width="390" height="48" rx="14" fill="#020617" stroke="#1e293b"/>
    <text x="50" y="204" fill="#94a3b8" font-size="11" font-weight="600">⚡ Quick Demo:</text>
    <rect x="250" y="185" width="70" height="28" rx="8" fill="#0c4a6e"/>
    <text x="270" y="203" fill="#38bdf8" font-size="11" font-weight="700">Buyer</text>
    <rect x="330" y="185" width="75" height="28" rx="8" fill="#064e3b"/>
    <text x="350" y="203" fill="#34d399" font-size="11" font-weight="700">Admin</text>

    <!-- Email Field -->
    <text x="30" y="255" fill="#cbd5e1" font-size="11" font-weight="700" letter-spacing="0.5">EMAIL ADDRESS</text>
    <rect x="30" y="265" width="390" height="44" rx="12" fill="#020617" stroke="#334155"/>
    <text x="45" y="292" fill="#ffffff" font-size="13">customer@dealership.com</text>

    <!-- Password Field -->
    <text x="30" y="340" fill="#cbd5e1" font-size="11" font-weight="700" letter-spacing="0.5">PASSWORD</text>
    <rect x="30" y="350" width="390" height="44" rx="12" fill="#020617" stroke="#334155"/>
    <text x="45" y="377" fill="#ffffff" font-size="13">••••••••••••</text>

    <!-- Submit Button -->
    <rect x="30" y="425" width="390" height="48" rx="14" fill="url(#btnGrad)"/>
    <text x="225" y="454" text-anchor="middle" fill="#020617" font-size="14" font-weight="800">Sign In</text>

    <!-- Footer Register prompt -->
    <text x="225" y="505" text-anchor="middle" fill="#94a3b8" font-size="12">
      Don't have an account? <tspan fill="#38bdf8" font-weight="700">Create an account</tspan>
    </text>
  </g>

  <!-- Gradients -->
  <defs>
    <linearGradient id="loginGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>
</svg>
